<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visite du Beit HaMikdash</title>
<style>
  :root {
    --encre: #1b1815;
    --pierre: #f3efe6;
    --pierre-creuse: #e6dfd0;
    --trait: #cbc0aa;
    --or: #9a6b1f;
    --sourd: #6d6353;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 15px/1.55 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    color: var(--encre); background: #0d0c0b; overflow: hidden;
  }
  canvas { display: block; }

  /* ---- chargement ---- */
  #chargement {
    position: fixed; inset: 0; z-index: 40; display: grid; place-content: center;
    gap: 18px; text-align: center; color: var(--pierre); background: #0d0c0b;
    transition: opacity .6s ease;
  }
  #chargement.parti { opacity: 0; pointer-events: none; }
  #chargement h1 { margin: 0; font-size: 26px; font-weight: 500; letter-spacing: .04em; }
  #chargement p { margin: 0; color: #8d8474; font-size: 13px; }
  #jauge { width: 260px; height: 2px; background: #2a2724; overflow: hidden; }
  #jauge i { display: block; height: 100%; width: 0; background: var(--or); transition: width .3s ease; }

  /* ---- invite de départ ---- */
  #invite {
    position: fixed; inset: 0; z-index: 30; display: grid; place-content: center;
    text-align: center; gap: 14px; color: var(--pierre);
    background: rgba(13,12,11,.72); backdrop-filter: blur(3px); cursor: pointer;
  }
  #invite[hidden] { display: none; }
  #invite b { font-size: 20px; font-weight: 500; letter-spacing: .03em; }
  #invite span { font-size: 13px; color: #9a9182; }
  kbd {
    font: inherit; font-size: 12px; padding: 1px 6px; border: 1px solid #4a453e;
    border-radius: 3px; background: #201d1a; color: #c8bfae;
  }

  /* ---- réticule ---- */
  #reticule {
    position: fixed; left: 50%; top: 50%; z-index: 10; width: 7px; height: 7px;
    margin: -3.5px 0 0 -3.5px; border-radius: 50%;
    background: rgba(255,255,255,.5); box-shadow: 0 0 0 1px rgba(0,0,0,.45);
    transition: transform .12s ease, background .12s ease;
  }
  #reticule.vise { transform: scale(1.9); background: var(--or); }

  /* ---- étiquette au survol ---- */
  #survol {
    position: fixed; left: 50%; top: calc(50% + 22px); z-index: 10;
    transform: translateX(-50%); padding: 4px 11px; border-radius: 3px;
    background: rgba(13,12,11,.78); color: #f0e9da; font-size: 13px;
    letter-spacing: .02em; white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity .12s ease;
  }
  #survol.vu { opacity: 1; }

  /* ---- barre du haut ---- */
  #barre {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex;
    gap: 8px; align-items: center; padding: 10px 12px;
    background: linear-gradient(rgba(13,12,11,.55), transparent);
  }
  #barre select, #barre button {
    font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 4px;
    border: 1px solid rgba(203,192,170,.28); background: rgba(20,18,16,.82);
    color: #e8e0d0; cursor: pointer;
  }
  #barre select:hover, #barre button:hover { border-color: var(--or); }
  #mode { font-size: 12px; letter-spacing: .04em; color: #9a9182; }
  #mode.vole { color: var(--or); }
  #position { margin-left: auto; font-size: 12px; color: #9a9182;
              font-variant-numeric: tabular-nums; }

  /* ---- fiche ---- */
  #fiche {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 25; width: min(400px, 92vw);
    padding: 22px 24px 40px; overflow-y: auto; background: var(--pierre);
    border-left: 1px solid var(--trait); box-shadow: -12px 0 40px rgba(0,0,0,.35);
    transform: translateX(101%); transition: transform .28s cubic-bezier(.22,.61,.36,1);
  }
  #fiche.ouverte { transform: none; }
  #fermer {
    position: absolute; top: 14px; right: 16px; width: 26px; height: 26px; padding: 0;
    font: inherit; font-size: 17px; line-height: 24px; color: var(--sourd);
    border: 1px solid var(--trait); border-radius: 4px; background: none; cursor: pointer;
  }
  #fermer:hover { color: var(--encre); border-color: var(--sourd); }
  .zone {
    font-size: 11px; text-transform: uppercase; letter-spacing: .13em;
    color: var(--sourd); margin: 0 0 6px;
  }
  #fiche h2 { margin: 0; font-size: 25px; font-weight: 500; line-height: 1.2; }
  .heb {
    margin: 3px 0 0; font-size: 21px; color: var(--or);
    font-family: "Frank Ruehl", "Times New Roman", serif; direction: rtl;
  }
  .translit { margin: 1px 0 0; font-size: 13px; font-style: italic; color: var(--sourd); }
  .resume { margin: 18px 0 0; }
  .vide { margin: 18px 0 0; padding: 12px 14px; font-size: 13.5px;
          color: var(--sourd); background: var(--pierre-creuse); border-radius: 4px; }
  h3 {
    margin: 24px 0 8px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .13em; color: var(--sourd); font-weight: 600;
  }
  .cotes { margin: 0; padding: 0; list-style: none; font-size: 14px; }
  .cotes li { padding: 5px 0; border-bottom: 1px solid var(--trait); }
  .cotes li:last-child { border-bottom: 0; }
  .sources { margin: 0; padding: 0; list-style: none; }
  .sources li { padding: 7px 0; border-bottom: 1px solid var(--trait); font-size: 14px; }
  .sources li:last-child { border-bottom: 0; }
  .sources a { color: var(--or); text-decoration: none; border-bottom: 1px solid transparent; }
  .sources a:hover { border-bottom-color: var(--or); }
  .sources em { display: block; margin-top: 3px; font-size: 13px; color: var(--sourd); }
  .note { margin: 22px 0 0; padding: 12px 14px; font-size: 13.5px;
          background: var(--pierre-creuse); border-left: 2px solid var(--or); border-radius: 0 4px 4px 0; }
  .note b { display: block; font-size: 11px; text-transform: uppercase;
            letter-spacing: .13em; color: var(--sourd); margin-bottom: 4px; }
</style>

<div id="chargement">
  <h1>Beit HaMikdash</h1>
  <div id="jauge"><i></i></div>
  <p id="etat">chargement de la scène…</p>
</div>

<div id="invite" hidden>
  <b>Entrer dans la visite</b>
  <span><kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> ou les flèches pour marcher ·
        <kbd>Maj</kbd> pour courir · clic sur un élément pour l'interroger<br>
        <kbd>V</kbd> pour le vol libre, puis <kbd>Espace</kbd> monter et <kbd>C</kbd> descendre ·
        <kbd>Échap</kbd> pour sortir</span>
</div>

<div id="barre">
  <select id="aller"><option value="">Aller à…</option></select>
  <select id="chercher"><option value="">Un élément…</option></select>
  <button id="vol" title="Basculer marche / vol libre (V)">Vol libre</button>
  <span id="mode">à pied</span>
  <span id="position"></span>
</div>

<div id="reticule"></div>
<div id="survol"></div>

<aside id="fiche"><button id="fermer" title="Fermer">×</button><div id="corps"></div></aside>
